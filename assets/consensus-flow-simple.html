<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>How /consensus works (simple) - deliberation</title>
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
    }
    .wrap { width: 1000px; height: 420px; margin: 0 auto; }
    svg { display: block; }
    text { dominant-baseline: middle; }
  </style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1000 420" width="1000" height="420" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect width="1000" height="420" fill="#ffffff" />

  <text x="40" y="38" font-size="22" font-weight="700" fill="#0f172a">How /consensus works</text>
  <text x="40" y="62" font-size="13" fill="#64748b">4 steps per round, repeats up to 5 rounds (consensus.maxRounds) until the panel agrees</text>

  <rect x="40" y="100" width="206" height="160" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#soft)" />
  <text x="56" y="125" font-size="11" font-weight="700" fill="#8b5cf6" letter-spacing="2">STEP 1</text>
  <text x="56" y="152" font-size="17" font-weight="700" fill="#0f172a">Blind verdict</text>
  <text x="56" y="184" font-size="13" fill="#0f172a">Claude records its own</text>
  <text x="56" y="204" font-size="13" fill="#0f172a">verdict before it sees</text>
  <text x="56" y="224" font-size="13" fill="#0f172a">any external answer.</text>

  <path d="M 251 180 L 273 180" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <rect x="278" y="100" width="206" height="160" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#soft)" />
  <text x="294" y="125" font-size="11" font-weight="700" fill="#3b82f6" letter-spacing="2">STEP 2</text>
  <text x="294" y="152" font-size="17" font-weight="700" fill="#0f172a">Panel review</text>
  <text x="294" y="184" font-size="13" fill="#0f172a">GPT, Gemini, Grok and any</text>
  <text x="294" y="204" font-size="13" fill="#0f172a">configured models review</text>
  <text x="294" y="224" font-size="13" fill="#0f172a">in parallel:</text>
  <text x="294" y="244" font-size="13" font-weight="600" fill="#0f172a">APPR / RC / REJECT.</text>

  <path d="M 489 180 L 511 180" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <rect x="516" y="100" width="206" height="160" rx="12" fill="#ffffff" stroke="#14b8a6" stroke-width="2" filter="url(#soft)" />
  <text x="532" y="125" font-size="11" font-weight="700" fill="#14b8a6" letter-spacing="2">STEP 3</text>
  <text x="532" y="152" font-size="17" font-weight="700" fill="#0f172a">Adjudicate</text>
  <text x="532" y="184" font-size="13" fill="#0f172a">Claude decides each issue:</text>
  <text x="532" y="204" font-size="13" font-weight="600" fill="#0f172a">accept / dismiss / defer,</text>
  <text x="532" y="224" font-size="13" fill="#0f172a">then gives its own verdict.</text>
  <text x="532" y="244" font-size="12" fill="#64748b">Dismissals need a reason.</text>

  <path d="M 727 180 L 749 180" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <rect x="754" y="100" width="206" height="160" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#soft)" />
  <text x="770" y="125" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="2">STEP 4</text>
  <text x="770" y="152" font-size="17" font-weight="700" fill="#0f172a">Converge or revise</text>
  <text x="770" y="184" font-size="13" fill="#0f172a">Converged when enough</text>
  <text x="770" y="204" font-size="13" fill="#0f172a">externals answer, all of</text>
  <text x="770" y="224" font-size="13" fill="#0f172a">them approve, Claude too.</text>
  <text x="770" y="244" font-size="12" fill="#64748b">Else revise the plan.</text>

  <path d="M 857 270 L 857 305 L 20 305 L 20 180 L 36 180" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-red)" />
  <text x="500" y="325" font-size="12" font-weight="700" text-anchor="middle" fill="#ef4444">If not converged, the revised plan loops back - up to 5 rounds, then UNRESOLVED</text>

  <line x1="40" y1="360" x2="960" y2="360" stroke="#e2e8f0" stroke-width="1" />
  <text x="40" y="385" font-size="12" fill="#64748b">"Enough" is consensus.quorumFloor externals (default 2, capped at the panel size), so Claude cannot approve alone.</text>
  <text x="40" y="405" font-size="12" fill="#64748b">Click the detailed version for the guards and per-model flow.</text>

</svg>
</div>
</body>
</html>
